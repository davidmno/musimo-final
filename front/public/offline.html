<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#C0451B" />
    <title>Sin conexión · musimo</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #151411; color: #FFF8F5; }
      * { box-sizing: border-box; }
      body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 90% 15%, rgba(192,69,27,.24), transparent 32%), radial-gradient(circle at 10% 90%, rgba(141,97,159,.2), transparent 34%), #151411; }
      main { width: min(100%, 620px); padding: clamp(28px, 8vw, 60px); border: 1px solid #3B3630; border-radius: 16px; background: #1D1B18; box-shadow: 0 18px 50px rgba(0,0,0,.36); }
      img { width: 92px; height: auto; margin-bottom: 28px; }
      p { color: #CEC7C1; line-height: 1.65; }
      .eyebrow { color: #C0451B; font-size: .75rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
      h1 { margin: 8px 0 12px; font-family: Fraunces, Georgia, serif; font-size: clamp(2rem, 7vw, 3.6rem); line-height: 1.05; }
      button { min-height: 44px; margin-top: 18px; padding: 10px 18px; border: 0; border-radius: 10px; background: #C0451B; color: white; font: inherit; font-weight: 700; cursor: pointer; }
      button:focus-visible { outline: 3px solid #FFF8F5; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/images/logo.png" alt="musimo" />
      <p class="eyebrow">Sin conexión</p>
      <h1>La música sigue; la red se tomó una pausa.</h1>
      <p>No pudimos cargar esta página. Revisá tu conexión y volvé a intentarlo. Las acciones que requieren tu cuenta no se guardan sin conexión.</p>
      <button type="button" onclick="window.location.reload()">Intentar nuevamente</button>
    </main>
  </body>
</html>
